# 一加 15T / 骁龙 8 Elite Gen 5（SM8850 / SM8850-AC）—— 原生调速器甜点预设
# 4.61 / 3.63 GHz（2×Oryon L + 6×Oryon M），Adreno 840 1200 MHz，165Hz LTPO。
# 专为不干预系统调速器（保持 ColorOS 原生 walt / scx + EAS）调校：
#   Oryon L 50%（~2.30 GHz，EAS 有效容量 ~512）> Oryon M 55%（~2.00 GHz，有效容量 ~443），
#   让承担 120/165Hz 日常交互主力的 6 颗性能核落在 3nm 甜点电压区，且维持 EAS 容量梯度不倒挂；
#   GPU 42%（~504 MHz）；针对 6.32 寸紧凑机身将温控前移至 70/64℃，PSI 瞬态借出放宽至 15%。
#
# 本文件只提供"全新安装"默认与 WebUI「应用推荐预设」；升级安装不会覆写已有配置。
#match brand=OnePlus
#match soc=SM8850

default_cpu_pct_big=50
default_cpu_pct_little=55
default_gpu_pct=42
default_th_high=70
default_th_low=64
default_psi_gain=15
